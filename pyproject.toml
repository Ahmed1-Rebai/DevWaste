[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devwaste"
version = "0.1.0"
description = "Deep Learning for Docker Resource Anomaly Detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ahmed1-Rebai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "docker>=7.0.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
devwaste = "devwaste.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/devwaste"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C408",  # unnecessary collection call
]

[tool.ruff.lint.isort]
known-first-party = ["devwaste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: needs a running Docker daemon (deselected by default; run with -m integration)",
]

[tool.coverage.run]
source = ["devwaste"]
omit = ["tests/*"]