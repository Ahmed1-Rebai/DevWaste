name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (no Docker, no GPU)
        run: pytest

      - name: Smoke test non-editable install
        run: |
          pip install --no-deps --force-reinstall .
          cd "$RUNNER_TEMP"
          devwaste --help
          devwaste simulate --scenario normal --output smoke/train.csv --n-samples 300
          devwaste simulate --scenario cpu-spike --output smoke/test.csv --n-samples 300 --seed 7
          devwaste train --data smoke/train.csv --output-dir smoke/model --epochs 2
          devwaste evaluate --data smoke/test.csv --model smoke/model
