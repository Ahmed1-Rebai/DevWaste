<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      /* Palette taken from the real terminal recording in docs/media/. */
      :root {
        --ground: #171b22;
        --ink: #e6edf3;
        --muted: #8b949e;
        --red: #f85149;
        --green: #7ee787;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="stack" data-composition-id="stack" data-composition-src="compositions/stack.html"
        data-start="3" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="learn" data-composition-id="learn" data-composition-src="compositions/learn.html"
        data-start="8" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="watch" data-composition-id="watch" data-composition-src="compositions/watch.html"
        data-start="13" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="catch" data-composition-id="catch" data-composition-src="compositions/catch.html"
        data-start="17" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="24" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="29" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920"></div>

      <!-- Voiceover: local Kokoro TTS (am_michael, 1.1x); script in assets/voice/script.txt. -->
      <audio id="vo-1" class="clip" src="assets/voice/vo-1.wav" data-duration="2.65"
        data-start="0.15" data-track-index="4" data-volume="1.678804"></audio>
      <audio id="vo-2" class="clip" src="assets/voice/vo-2.wav" data-duration="4.76"
        data-start="3.15" data-track-index="4" data-volume="1.230269"></audio>
      <audio id="vo-3" class="clip" src="assets/voice/vo-3.wav" data-duration="4.8"
        data-start="8.1" data-track-index="4" data-volume="1.659587"></audio>
      <audio id="vo-4" class="clip" src="assets/voice/vo-4.wav" data-duration="2.15"
        data-start="13.35" data-track-index="4" data-volume="1.496236"></audio>
      <!-- Leads the cut: "Then a real load spike hits Redis" lands as the ALERT rows appear. -->
      <audio id="vo-5" class="clip" src="assets/voice/vo-5.wav" data-duration="5.65"
        data-start="16.8" data-track-index="4" data-volume="1.348963"></audio>
      <audio id="vo-6" class="clip" src="assets/voice/vo-6.wav" data-duration="4.1"
        data-start="24.2" data-track-index="4" data-volume="1.428894"></audio>

      <!-- Sound: bundled media-use effects, under the voice; each peak lands on the picture. -->
      <audio id="sfx-cut-1" class="clip" src="assets/sfx/whoosh.mp3"
        data-start="2.87" data-duration="0.575" data-track-index="3" data-volume="0.18"></audio>
      <audio id="sfx-cut-2" class="clip" src="assets/sfx/whoosh-cinematic.mp3"
        data-start="7.3" data-media-start="1.8" data-duration="1.6" data-track-index="3"
        data-volume="0.15" data-fade-out="0.4"></audio>
      <audio id="sfx-cut-3" class="clip" src="assets/sfx/whoosh.mp3"
        data-start="12.87" data-duration="0.575" data-track-index="3" data-volume="0.14"></audio>
      <audio id="sfx-alert" class="clip" src="assets/sfx/notification.mp3"
        data-start="16.89" data-duration="1.5" data-track-index="3" data-volume="0.2"
        data-fade-out="0.3"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/impact-bass-2.mp3"
        data-start="22.05" data-duration="2.59" data-track-index="3" data-volume="0.22"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
