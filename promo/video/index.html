<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#171b22"},
    {"id":"color-ink","type":"color","label":"Text","default":"#e6edf3"},
    {"id":"color-accent","type":"color","label":"Alert accent","default":"#f85149"},
    {"id":"color-ok","type":"color","label":"Normal accent","default":"#7ee787"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #171b22;
        --color-ink: #e6edf3;
        --color-accent: #f85149;
        --color-ok: #7ee787;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <!--
      DevWaste AI, vertical LinkedIn promo (1080x1920, 28 s).
      Every terminal image is a crop of a real screenshot from docs/media/,
      recorded from a real DevWaste run against the FlakeRadar Docker stack.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <div id="ground" class="clip" data-start="0" data-duration="28" data-track-index="0"></div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="stack"
        data-composition-id="stack"
        data-composition-src="compositions/stack.html"
        data-start="3"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="train"
        data-composition-id="train"
        data-composition-src="compositions/train.html"
        data-start="8"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="watch"
        data-composition-id="watch"
        data-composition-src="compositions/watch.html"
        data-start="13"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="catch"
        data-composition-id="catch"
        data-composition-src="compositions/catch.html"
        data-start="17"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="24"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="3"
        data-duration="21"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio
        id="sfx-whoosh-1"
        class="clip"
        src="assets/sfx/whoosh-short.mp3"
        data-start="2.82"
        data-duration="0.6"
        data-track-index="10"
        data-volume="0.3"
      ></audio>
      <audio
        id="sfx-whoosh-2"
        class="clip"
        src="assets/sfx/whoosh-short.mp3"
        data-start="7.78"
        data-duration="0.6"
        data-track-index="10"
        data-volume="0.25"
      ></audio>
      <audio
        id="sfx-alert"
        class="clip"
        src="assets/sfx/alert-error.mp3"
        data-start="17.12"
        data-duration="1.6"
        data-track-index="11"
        data-volume="0.45"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
